name: Generate Laitstyles Phase 6 lockfile

on:
  pull_request:
    paths:
      - .github/workflows/export-pnpm-11-13-0.yml
      - tools/laitstyles-lockgen/**

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up pnpm 11.13.0
        uses: pnpm/action-setup@v4
        with:
          version: 11.13.0
          run_install: false

      - name: Set up Node.js 25
        uses: actions/setup-node@v4
        with:
          node-version: '25'

      - name: Generate from the existing importer resolutions
        working-directory: tools/laitstyles-lockgen
        shell: bash
        run: |
          set -euo pipefail
          cp package.json package-ranges.json
          cp package-pinned.json package.json
          pnpm install --lockfile-only --ignore-scripts --no-frozen-lockfile
          mv package-ranges.json package.json
          pnpm install --lockfile-only --ignore-scripts --offline --no-frozen-lockfile

      - name: Prove zero unrelated lockfile drift
        working-directory: tools/laitstyles-lockgen
        run: node verify-lockfile.mjs

      - name: Prove frozen installation
        working-directory: tools/laitstyles-lockgen
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Upload verified lockfile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: laitstyles-phase-6-lockfile
          path: |
            tools/laitstyles-lockgen/pnpm-lock.yaml
            tools/laitstyles-lockgen/lockfile-validation.json
          if-no-files-found: error
          retention-days: 1
