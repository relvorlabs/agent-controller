name: Export pnpm 11.13.0

on:
  pull_request:
    paths:
      - .github/workflows/export-pnpm-11-13-0.yml

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm 11.13.0
        uses: pnpm/action-setup@v4
        with:
          version: 11.13.0
          run_install: false

      - name: Package complete pnpm installation
        shell: bash
        run: |
          set -euo pipefail
          test "$(pnpm --version)" = "11.13.0"
          mkdir -p pnpm-portable
          cp -a /home/runner/setup-pnpm pnpm-portable/setup-pnpm
          printf '%s\n' '/home/runner/setup-pnpm/node_modules/.bin/pnpm' > pnpm-portable/installed-path.txt
          test -f pnpm-portable/setup-pnpm/node_modules/.pnpm/pnpm@11.13.0/node_modules/pnpm/bin/pnpm.mjs
          du -sh pnpm-portable/setup-pnpm > pnpm-portable/size.txt

      - name: Upload pnpm artifact
        uses: actions/upload-artifact@v4
        with:
          name: pnpm-11.13.0-complete
          path: pnpm-portable/
          if-no-files-found: error
          retention-days: 1
