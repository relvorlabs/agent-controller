name: Laitstyles Phase 0 Playwright Runner

on:
  push:
    branches:
      - agent/laitstyles-phase0-playwright-runner
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phase0-playwright:
    name: Remote Playwright characterization
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Create isolated Playwright workspace
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/laitstyles-phase0/tests" "$RUNNER_TEMP/laitstyles-phase0/evidence"
          cd "$RUNNER_TEMP/laitstyles-phase0"
          npm init -y
          npm install --save-dev @playwright/test@1.61.1
          npx playwright install --with-deps chromium

      - name: Validate public Laitstyles deployment
        id: discover
        shell: bash
        run: |
          cd "$RUNNER_TEMP/laitstyles-phase0"
          cat > discover.mjs <<'EOF'
          import fs from "node:fs";

          const url = "https://laitstyles.vercel.app/";
          const response = await fetch(url, {
            redirect: "follow",
            signal: AbortSignal.timeout(20_000),
            headers: { "user-agent": "Laitstyles-Phase0-Characterization/1.0" },
          });
          const body = await response.text();
          const title = body.match(/<title[^>]*>([^<]*)<\/title>/i)?.[1]?.trim() ?? null;
          const looksLikeLaitstyle = /laitstyle|one-of-one second-hand pieces from lagos/i.test(
            `${title ?? ""}\n${body.slice(0, 20000)}`,
          );
          const result = {
            requestedUrl: url,
            status: response.status,
            finalUrl: response.url,
            title,
            bytes: Buffer.byteLength(body),
            looksLikeLaitstyle,
          };
          fs.writeFileSync("evidence/deployment-probe.json", JSON.stringify(result, null, 2));
          if (!response.ok || !looksLikeLaitstyle) {
            console.error("The public deployment did not identify as Laitstyles.", result);
            process.exit(2);
          }
          fs.appendFileSync(process.env.GITHUB_ENV, `LAITSTYLES_BASE_URL=${response.url}\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `base_url=${response.url}\n`);
          console.log(`Selected ${response.url}`);
          EOF
          node discover.mjs

      - name: Write Playwright characterization suite
        if: always() && steps.discover.outcome == 'success'
        shell: bash
        run: |
          cd "$RUNNER_TEMP/laitstyles-phase0"
          cat > playwright.config.mjs <<'EOF'
          import { defineConfig, devices } from "@playwright/test";

          export default defineConfig({
            testDir: "./tests",
            timeout: 90_000,
            expect: { timeout: 15_000 },
            fullyParallel: false,
            retries: 0,
            workers: 1,
            reporter: [
              ["list"],
              ["html", { outputFolder: "evidence/html-report", open: "never" }],
              ["json", { outputFile: "evidence/results.json" }],
              ["junit", { outputFile: "evidence/junit.xml" }],
            ],
            outputDir: "evidence/test-results",
            use: {
              baseURL: process.env.LAITSTYLES_BASE_URL,
              trace: "on",
              screenshot: "on",
              video: "retain-on-failure",
              actionTimeout: 15_000,
              navigationTimeout: 30_000,
            },
            projects: [
              {
                name: "desktop-chromium",
                use: { ...devices["Desktop Chrome"], viewport: { width: 1280, height: 800 } },
              },
              {
                name: "tablet-chromium",
                use: { ...devices["Desktop Chrome"], viewport: { width: 768, height: 1024 } },
              },
              {
                name: "mobile-chromium",
                use: {
                  ...devices["iPhone 13"],
                  browserName: "chromium",
                  viewport: { width: 375, height: 812 },
                },
              },
            ],
          });
          EOF

          cat > tests/phase0.spec.mjs <<'EOF'
          import fs from "node:fs";
          import path from "node:path";
          import { test, expect } from "@playwright/test";

          const evidenceDir = path.resolve("evidence", "screenshots");
          fs.mkdirSync(evidenceDir, { recursive: true });

          const unexpectedErrors = (messages) =>
            messages.filter(
              (message) =>
                !/favicon|Failed to load resource.*404|third-party cookie|hydration.*extension/i.test(
                  message,
                ),
            );

          async function activateLazySections(page) {
            await page.evaluate(async () => {
              const delay = (milliseconds) =>
                new Promise((resolve) => window.setTimeout(resolve, milliseconds));
              let previousHeight = 0;
              for (let pass = 0; pass < 3; pass += 1) {
                const height = document.documentElement.scrollHeight;
                if (height === previousHeight && pass > 0) break;
                previousHeight = height;
                const step = Math.max(300, Math.floor(window.innerHeight * 0.7));
                for (let y = 0; y < height; y += step) {
                  window.scrollTo(0, y);
                  await delay(120);
                }
                window.scrollTo(0, height);
                await delay(350);
              }
              window.scrollTo(0, 0);
              await delay(350);
            });
          }

          for (const theme of ["light", "dark"]) {
            test(`homepage contract — ${theme}`, async ({ page }, testInfo) => {
              const consoleErrors = [];
              const pageErrors = [];
              const failedRequests = [];

              page.on("console", (message) => {
                if (message.type() === "error") consoleErrors.push(message.text());
              });
              page.on("pageerror", (error) => pageErrors.push(error.message));
              page.on("requestfailed", (request) => {
                const failure = request.failure()?.errorText ?? "unknown";
                failedRequests.push(`${request.method()} ${request.url()} — ${failure}`);
              });

              await page.emulateMedia({ colorScheme: theme });
              await page.addInitScript((selectedTheme) => {
                try {
                  localStorage.setItem("theme", selectedTheme);
                } catch {}
              }, theme);

              const response = await page.goto("/", { waitUntil: "networkidle" });
              expect(response, "homepage navigation should return a response").not.toBeNull();
              expect(response.status(), "homepage should not return a server error").toBeLessThan(500);
              await expect(page.locator("body")).toContainText(/Laitstyle|Shop|Collection|Product/i);
              await activateLazySections(page);

              await page.screenshot({
                path: path.join(
                  evidenceDir,
                  `${testInfo.project.name}-${theme}-homepage-full.png`,
                ),
                fullPage: true,
              });
              await page.screenshot({
                path: path.join(
                  evidenceDir,
                  `${testInfo.project.name}-${theme}-homepage-viewport.png`,
                ),
              });

              const links = await page.locator("a[href]").evaluateAll((nodes) =>
                nodes.slice(0, 150).map((node) => ({
                  text: (node.textContent ?? "").trim(),
                  href: node.getAttribute("href") ?? "",
                })),
              );
              fs.writeFileSync(
                path.resolve("evidence", `${testInfo.project.name}-${theme}-links.json`),
                JSON.stringify(links, null, 2),
              );

              fs.writeFileSync(
                path.resolve(
                  "evidence",
                  `${testInfo.project.name}-${theme}-runtime-errors.json`,
                ),
                JSON.stringify({ consoleErrors, pageErrors, failedRequests }, null, 2),
              );

              expect(unexpectedErrors(pageErrors), `page errors: ${pageErrors.join("\n")}`).toEqual([]);
              expect(
                unexpectedErrors(consoleErrors),
                `console errors: ${consoleErrors.join("\n")}`,
              ).toEqual([]);
              expect(
                failedRequests.filter((entry) => !/image|analytics|favicon/i.test(entry)),
                `failed requests: ${failedRequests.join("\n")}`,
              ).toEqual([]);
            });
          }

          test("storefront product interaction characterization", async ({ page }, testInfo) => {
            await page.goto("/", { waitUntil: "networkidle" });
            await activateLazySections(page);
            const target = page.locator('a[href^="/products/"]').first();
            const href = await target.getAttribute("href");
            expect(href, "a product link should be present on the homepage").toBeTruthy();

            const beforeUrl = page.url();
            await target.click();
            await page.waitForLoadState("networkidle").catch(() => {});

            const afterUrl = page.url();
            const productHeading = page.getByRole("heading", { level: 1 }).first();
            const hasProductView = await productHeading.isVisible().catch(() => false);
            const interactionMode =
              afterUrl !== beforeUrl
                ? "navigation"
                : hasProductView
                  ? "in-place-product-view"
                  : "no-observable-result";

            fs.writeFileSync(
              path.resolve("evidence", `${testInfo.project.name}-product-interaction.json`),
              JSON.stringify({ href, beforeUrl, afterUrl, interactionMode }, null, 2),
            );

            expect(
              interactionMode,
              "clicking a product should navigate or render an in-place product view",
            ).not.toBe("no-observable-result");

            await page.screenshot({
              path: path.join(evidenceDir, `${testInfo.project.name}-product-interaction.png`),
              fullPage: true,
            });
          });

          test("runtime route and redirect manifest", async ({ page }, testInfo) => {
            test.setTimeout(300_000);
            await page.goto("/", { waitUntil: "domcontentloaded" });
            const discoveredLinks = await page.locator("a[href]").evaluateAll((nodes) =>
              nodes.map((node) => node.getAttribute("href") ?? "").filter(Boolean),
            );
            const productPath = discoveredLinks.find((href) => href.startsWith("/products/"));
            const collectionPath = discoveredLinks.find((href) => href.startsWith("/collections/"));

            const routes = [
              "/",
              "/products",
              ...(productPath ? [productPath] : []),
              ...(collectionPath ? [collectionPath] : []),
              "/cart",
              "/checkout",
              "/order-confirmation",
              "/account",
              "/account/orders",
              "/account/orders/detail",
              "/account/profile",
              "/account/preferences",
              "/account/notifications",
              "/account/privacy",
              "/account/support",
              "/auth/sign-in",
              "/auth/sign-up",
              "/auth/forgot-password",
              "/auth/reset-password",
              "/auth/error",
              "/admin",
              "/admin/inventory",
              "/admin/orders",
              "/admin/holds",
              "/admin/returns",
              "/admin/customers",
              "/admin/settings",
              "/control-room",
              "/api/health",
            ];

            const entries = [];
            for (const route of [...new Set(routes)]) {
              let response = null;
              let navigationError = null;
              try {
                response = await page.goto(route, {
                  waitUntil: "domcontentloaded",
                  timeout: 20_000,
                });
              } catch (error) {
                navigationError = error instanceof Error ? error.message : String(error);
              }
              entries.push({
                route,
                status: response?.status() ?? null,
                finalUrl: page.url(),
                title: await page.title().catch(() => null),
                navigationError,
              });
            }

            fs.writeFileSync(
              path.resolve("evidence", `${testInfo.project.name}-runtime-route-manifest.json`),
              JSON.stringify({ productPath, collectionPath, entries }, null, 2),
            );

            const fatal = entries.filter(
              (entry) => entry.navigationError || (entry.status !== null && entry.status >= 500),
            );
            expect(fatal, "known routes must not fail navigation or return 5xx").toEqual([]);
          });

          test("unauthenticated admin boundary characterization", async ({ page }, testInfo) => {
            const response = await page.goto("/admin", { waitUntil: "networkidle" });
            expect(response, "admin navigation should return a response").not.toBeNull();
            expect(response.status(), "admin boundary should not return a server error").toBeLessThan(500);

            const finalUrl = page.url();
            const bodyText = (await page.locator("body").innerText()).slice(0, 3000);
            const finalPath = new URL(finalUrl).pathname;
            const mode = finalPath.startsWith("/auth")
              ? "redirected-to-auth"
              : /sign in|unauthori[sz]ed|forbidden|access denied/i.test(bodyText)
                ? "access-boundary"
                : /overview|inventory|orders|control room/i.test(bodyText)
                  ? "admin-shell"
                  : "unclassified";

            fs.writeFileSync(
              path.resolve("evidence", `${testInfo.project.name}-admin-boundary.json`),
              JSON.stringify(
                { status: response.status(), finalUrl, finalPath, mode, bodySample: bodyText },
                null,
                2,
              ),
            );
            await page.screenshot({
              path: path.join(evidenceDir, `${testInfo.project.name}-admin-boundary.png`),
              fullPage: true,
            });
            expect(mode, "admin boundary should produce an observable access mode").not.toBe(
              "unclassified",
            );
          });
          EOF

      - name: Run Playwright characterization
        if: always() && steps.discover.outcome == 'success'
        id: playwright
        shell: bash
        run: |
          cd "$RUNNER_TEMP/laitstyles-phase0"
          set +e
          npx playwright test
          status=$?
          echo "$status" > evidence/playwright-exit-code.txt
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit "$status"

      - name: Write evidence manifest
        if: always()
        shell: bash
        run: |
          cd "$RUNNER_TEMP/laitstyles-phase0"
          {
            echo "# Laitstyles Phase 0 Playwright Evidence"
            echo
            echo "- Runner repository: relvorlabs/agent-controller"
            echo "- Runner commit: $GITHUB_SHA"
            echo "- Workflow run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "- Target URL: ${LAITSTYLES_BASE_URL:-not discovered}"
            echo "- Playwright version: 1.61.1"
            echo "- Browser: Chromium"
            echo "- Projects: desktop 1280x800, tablet 768x1024, mobile 375x812"
            echo "- Themes: light and dark"
            echo "- Evidence: full-page + viewport screenshots, runtime errors, links, product interaction, route/redirect manifest, admin access boundary"
            echo "- Playwright exit code: ${{ steps.playwright.outputs.exit_code || 'not-run' }}"
            echo
            echo "This external public runner does not checkout or expose the private Laitstyles repository."
          } > evidence/README.md

      - name: Upload Phase 0 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: laitstyles-phase0-playwright-${{ github.run_id }}
          path: ${{ runner.temp }}/laitstyles-phase0/evidence
          if-no-files-found: error
          retention-days: 30
